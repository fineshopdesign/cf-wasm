packages:
  - packages/*
  - examples/*
  - __tests__

shellEmulator: true
enablePrePostScripts: true
engineStrict: true
preferWorkspacePackages: true
linkWorkspacePackages: true
strictPeerDependencies: true
autoInstallPeers: false
dedupePeers: true

minimumReleaseAge: 1440

catalog:
  "@types/node": ^26.1.2
  "@types/react": ^19.3.0
  react: ^19.3.0
  tsdown: ^0.23.0
  vite: ^7.2.2
  vitest: ^5.0.0
  wasm-pack: ^0.15.0
  wrangler: ^4.131.1

allowBuilds:
  "@biomejs/biome": true
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  wasm-pack: true
  workerd: true
