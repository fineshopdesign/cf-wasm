name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# env:
#   TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
#   TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
#   TURBO_CACHE: remote:rw

jobs:
  test:
    name: Run tests
    uses: ./.github/workflows/build-test-reusable.yml
    if: "${{ !contains(github.event.head_commit.message, '[ci] release') }}"
    secrets: inherit

  publish:
    name: Changelog PR or Release
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    if: |
      ${{ github.repository_owner == 'fineshopdesign' && !cancelled() && (success() || failure() || needs.test.result == 'skipped') }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Git user
        run: |
          git config user.name "ahrixbot"
          git config user.email "173301862+ahrixbot@users.noreply.github.com"

      - name: Use pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Create Release Pull Request or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.AHRIX_BOT_GITHUB_TOKEN }}
          commit-message: "[ci] release"
          pr-title: "[ci] release"
          publish-script: pnpm publish-packages
          version-script: pnpm version-packages
